name: Bets research validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research*"
      - "scripts/train-research.py"
      - "scripts/verify-research.mjs"
      - "src/ratings.mjs"
      - "src/research*.mjs"
      - "data/private/research-models.json"
      - "data/private/recovered-results.json"
      - ".github/workflows/research.yml"
  pull_request:
    paths:
      - "scripts/research*"
      - "scripts/train-research.py"
      - "src/ratings.mjs"
      - "src/research*.mjs"
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/research-requirements.txt
      - run: python -m pip install -r scripts/research-requirements.txt
      - run: npm test
      - name: Replay verified series and fit candidate models
        run: |
          mkdir -p data/tmp
          node scripts/research-data.mjs
          python scripts/train-research.py data/tmp/research-data.json data/tmp/research-models.json --parity data/tmp/research-parity.json
          node scripts/verify-research.mjs data/tmp/research-models.json data/tmp/research-parity.json
      - uses: actions/upload-artifact@v4
        with:
          name: bets-research-candidate
          path: data/tmp/research-models.json
