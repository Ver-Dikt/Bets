name: Bets CS2 Map Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: "21 */6 * * *"
  push:
    paths:
      - "src/maps.mjs"
      - "scripts/collect-maps.mjs"
      - "scripts/map-insights.py"
      - ".github/workflows/maps.yml"
permissions:
  contents: write
concurrency:
  group: bets-map-sync
  cancel-in-progress: false
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: npm test
      - name: Fetch verified real map results
        shell: bash
        run: |
          node scripts/collect-maps.mjs || echo "::warning::CS2 map upstream unavailable; retaining existing verified map history"
      - name: Compute independent MIT-licensed map model
        run: python scripts/map-insights.py
      - name: Commit map dataset and model diagnostics
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/private/ data/public/map-insights.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update real CS2 map intelligence"
          for n in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflict while saving maps; existing source code was not overwritten"
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
