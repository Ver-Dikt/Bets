name: Bets Fixtures — CS2 & Dota 2
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - "src/fixtures.mjs"
      - "src/pandascore.mjs"
      - "src/pari.mjs"
      - "scripts/journal.mjs"
      - "scripts/journal-integrity.mjs"
      - "src/research*.mjs"
      - "src/ratings.mjs"
      - "src/dota-series.mjs"
      - "src/cs-results.mjs"
      - "data/private/research-models.json"
      - "scripts/fixtures.mjs"
      - ".github/workflows/fixtures.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bets-fixture-sync
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vendored CS2API runtime
        run: python -m pip install "aiohttp>=3.9,<4"
      - name: Query real CS2API upstream client (graceful if unavailable)
        shell: bash
        run: |
          python scripts/fixtures_cs2_sdk.py || echo "::warning::CS2API client source unavailable; fallback will be attempted"
      - name: Fetch CS2 and Dota 2 verified upcoming snapshots
        env:
          BETS_PARI_FEED_URL: ${{ secrets.BETS_PARI_FEED_URL }}
          BETS_PANDASCORE_TOKEN: ${{ secrets.BETS_PANDASCORE_TOKEN }}
        run: node scripts/fixtures.mjs
      - name: Commit public fixtures snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/fixtures.json
          if [[ -f data/public/journal.json ]]; then git add data/public/journal.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update esports fixture snapshots"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Commit conflict: not overwriting any source code"
              exit 1
            fi
            if git show origin/main:data/public/journal.json > "$RUNNER_TEMP/bets-journal-before.json"; then
              node scripts/check-journal.mjs "$RUNNER_TEMP/bets-journal-before.json" data/public/journal.json || exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

  publish:
    name: Publish latest verified Bets snapshots
    needs: fixtures
    if: needs.fixtures.result == 'success'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
