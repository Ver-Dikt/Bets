name: Test Bets
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify append-only forecast journal
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE" ]] && git show "$BASE:data/public/journal.json" > "$RUNNER_TEMP/bets-journal-before.json"; then
            node scripts/check-journal.mjs "$RUNNER_TEMP/bets-journal-before.json" data/public/journal.json
          fi
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build:pages
      - run: test -s dist/index.html && test -s dist/snapshot.json && test -s dist/fixtures.json && test -s dist/analysis.mjs && test -s dist/map-insights.json && test -s dist/main.js && test -s dist/research.json
