name: Test Bets
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build:pages
      - run: test -s dist/index.html && test -s dist/snapshot.json && test -s dist/main.js
